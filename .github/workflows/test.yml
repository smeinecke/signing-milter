name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  unit-and-integration:
    name: Build and test in Docker (${{ matrix.os-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os-version:
          - debian:buster
          - debian:bullseye
          - debian:bookworm
          - debian:trixie
          - ubuntu:focal
          - ubuntu:jammy
          - ubuntu:noble
          - ubuntu:resolute
    env:
      OS_VERSION: ${{ matrix.os-version }}
      WITH_REDIS: ${{ contains(fromJSON('["debian:trixie", "ubuntu:noble", "ubuntu:resolute"]'), matrix.os-version) && 'ON' || 'OFF' }}
      TEST_COMMAND: ${{ contains(fromJSON('["debian:trixie", "ubuntu:noble", "ubuntu:resolute"]'), matrix.os-version) && '/src/tests/integration/run-redis-test.sh /src/build' || '/bin/true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and run tests in Docker
        run: |
          docker compose -f tests/docker-compose.yml up --build --abort-on-container-exit

  systemd-smoketest:
    name: Systemd smoke test (${{ matrix.os-version }})
    runs-on: ubuntu-latest
    needs: unit-and-integration
    strategy:
      fail-fast: false
      matrix:
        os-version:
          - debian:buster
          - debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Build systemd smoke-test image
        run: |
          IMAGE_TAG=signing-milter-systemd-$(printf '%s' '${{ matrix.os-version }}' | tr ':' '-')
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          docker build -f tests/Dockerfile.systemd \
            -t "$IMAGE_TAG" \
            --build-arg OS_VERSION=${{ matrix.os-version }} \
            .

      - name: Start container and run smoke test
        run: |
          docker run --rm -d \
            --name signing-milter-systemd \
            --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            "$IMAGE_TAG"
          # Give systemd a moment to settle before starting the service.
          sleep 5
          docker exec signing-milter-systemd /src/tests/systemd-smoketest.sh

      - name: Stop systemd container
        if: always()
        run: docker stop signing-milter-systemd || true

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--unixsocket", "/data/redis.sock", "--port", "0", "--unixsocketperm", "777"]
    volumes:
      - redis-data:/data

  tests:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    image: signing-milter-tests
    depends_on:
      - redis
    command: ["/src/tests/integration/run-redis-test.sh", "/src/build"]
    user: root
    environment:
      - REDIS_URI=unix:/data/redis.sock
    volumes:
      - redis-data:/data

volumes:
  redis-data:
